[target.aarch64-unknown-none]
rustflags = [
    "-C", "link-arg=-Lkernel-aarch64",
    "-C", "link-arg=-Tlinker.ld",
]

[target.riscv64gc-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Lkernel-riscv64",
    "-C", "link-arg=-Tlinker.ld",
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "--cfg", "curve25519_dalek_backend=\"fiat\"",
]
