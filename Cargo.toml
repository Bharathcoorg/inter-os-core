[workspace]
members = [
    "apps/settings",
    "apps/dialer",
    "apps/vault",
    "apps/camera",
    "apps/file_manager",
    "apps/browser",
    "apps/messages",
    "apps/calendar",
    "apps/music",
    "apps/calculator",
    "sdk/rust/interos-std",
    "userspace/init",
    "userspace/system-service",
    "apps/compositor",
    "apps/launcher",
    "apps/gallery",
    "apps/notes",
    "apps/agent_manager",
    "apps/video_player",
    "apps/webview_demo",
    "crates/interos-android-format",
    "crates/interos-acr",
]
exclude = [
    "boot",
    "kernel",
    "kernel-aarch64",
    "kernel-riscv64",
    "kernel/src/compat/android/shared",
    "tools/mkbootimg",
    "tests/rust/fdt",
]
resolver = "2"

[profile.dev]
opt-level = 3
panic = "abort"
incremental = false
# WHY debuginfo stays ON here: ordinary developer builds (kernel + userspace
# daemons) keep their symbols so GDB, QEMU -s and backtraces stay useful, and
# `INTEROS_KERNEL_PROFILE=debug` remains meaningful. The embedded-image size
# problem is solved where it belongs, in the artifact pipeline: the userspace
# ELFs the kernel embeds into .rodata (kernel/src/task/images.rs) are stripped
# per-binary by tools/build_userspace.py and by the manifest fallback builder
# in tools/interos.py (llvm-strip --strip-debug --strip-unneeded). Without
# stripping, ~20 debug ELFs of ~15MB each put ~300MB of debuginfo into the
# BIOS image: it grows to 314MB and the bootloader's second stage spends many
# minutes reading it through BIOS int13h under TCG, which looks like a boot
# hang. Measured with `strip --strip-debug`: launcher 15.1MB -> 1.4MB.

[profile.release]
panic = "abort"
lto = true
