[workspace]
members = [
    "apps/settings",
    "apps/terminal",
    "apps/dialer",
    "apps/vault",
    "apps/camera",
    "apps/file_manager",
    "apps/browser",
    "apps/messages",
    "apps/calendar",
    "apps/music",
    "apps/calculator",
    "sdk/rust/interos-std",
    "userspace/init",
    "userspace/system-service",
    "apps/compositor",
    "apps/launcher",
    "apps/gallery",
    "apps/notes",
]
exclude = [
    "boot",
    "kernel",
    "kernel-aarch64",
    "kernel-riscv64",
    "kernel/src/compat/android/shared",
    "tools/mkbootimg",
    "tests/rust/fdt",
]
resolver = "2"

[profile.dev]
opt-level = 3
panic = "abort"

[profile.release]
panic = "abort"
lto = true
