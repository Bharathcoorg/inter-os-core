<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dynamic Rendering Fixture</title>
</head>
<body>
<p id="s">start</p>
<button id="btn" onclick="document.getElementById('out').textContent = 'DYNAMIC_CLICKED_42';">Change text</button>
<script>
function boot() {
  var p = document.createElement('p');
  p.textContent = 'DYNAMIC_OK_42';
  document.body.appendChild(p);
  p.id = 'out';
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
