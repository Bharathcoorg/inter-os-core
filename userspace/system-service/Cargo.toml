[package]
name = "interos-system-service"
version = "0.1.0"
edition = "2021"

[features]
ci-fault-injection = []

[dependencies]
interos-std = { path = "../../sdk/rust/interos-std" }


# WHY: this no_std library owns the single #[panic_handler] shared by
# all daemons. A libtest harness links std and duplicates the panic_impl
# lang item, and the crate has no unit tests, so no harness is ever built.
[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "displayd"
path = "src/bin/displayd.rs"
test = false
bench = false

[[bin]]
name = "inputd"
path = "src/bin/inputd.rs"
test = false
bench = false

[[bin]]
name = "storaged"
path = "src/bin/storaged.rs"
test = false
bench = false

[[bin]]
name = "netd"
path = "src/bin/netd.rs"
test = false
bench = false

[[bin]]
name = "powerd"
path = "src/bin/powerd.rs"
test = false
bench = false

[[bin]]
name = "modemd"
path = "src/bin/modemd.rs"
test = false
bench = false

[[bin]]
name = "audiod"
path = "src/bin/audiod.rs"
test = false
bench = false

[[bin]]
name = "camerad"
path = "src/bin/camerad.rs"
test = false
bench = false

[[bin]]
