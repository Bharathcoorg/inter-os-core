[package]
license = "AGPL-3.0-only"
name = "agent_manager"
version = "0.1.0"
edition = "2021"
description = "Native InterOS Agent Manager and Model Supervisor"

[dependencies]
interos-std = { path = "../../sdk/rust/interos-std" }

[lib]
name = "agent_manager"
path = "src/lib.rs"
crate-type = ["lib"]

[[bin]]
name = "agent_manager"
path = "src/main.rs"
test = false
bench = false

[lints.cargo]
non_kebab_case_bins = "allow"
