<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sovereign Authenticator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 16px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .title-row { display: flex; align-items: center; gap: 10px; }
    .badge {
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(56, 239, 125, 0.15);
      color: #38ef7d;
      border: 1px solid rgba(56, 239, 125, 0.3);
      font-family: monospace;
    }
    .token-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: border-color 0.2s;
    }
    .token-card:hover { border-color: #38ef7d; }
    .token-info h4 { margin: 0 0 4px 0; font-size: 14px; color: #8b949e; }
    .token-code {
      font-family: "SF Mono", Monaco, Consolas, monospace;
      font-size: 24px;
      font-weight: 700;
      color: #38ef7d;
      letter-spacing: 2px;
      cursor: pointer;
    }
    .timer-ring {
      position: relative;
      width: 36px;
      height: 36px;
    }
    .timer-ring svg { transform: rotate(-90deg); }
    .timer-ring circle {
      fill: none;
      stroke-width: 3;
    }
    .timer-bg { stroke: #30363d; }
    .timer-progress {
      stroke: #38ef7d;
      stroke-dasharray: 100;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 1s linear;
    }
    .btn-add {
      width: 100%;
      background: #238636;
      border: none;
      color: #ffffff;
      padding: 12px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-add:hover { background: #2ea043; }
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #38ef7d;
      color: #0d1117;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 12px;
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title-row">
      <h3 style="margin:0;">Authenticator</h3>
      <span class="badge">ENCLAVE SECURE</span>
    </div>
    <div class="timer-ring">
      <svg width="36" height="36">
        <circle class="timer-bg" cx="18" cy="18" r="15"/>
        <circle id="global-timer" class="timer-progress" cx="18" cy="18" r="15"/>
      </svg>
    </div>
  </div>

  <div id="tokens-list">
    <div class="token-card" data-code="742819">
      <div class="token-info">
        <h4>InterOS Root Keystore</h4>
        <div class="token-code">742 819</div>
      </div>
      <button class="copy-btn" style="background:none;border:none;color:#8b949e;cursor:pointer;">📋</button>
    </div>

    <div class="token-card" data-code="309481">
      <div class="token-info">
        <h4>Sovereign Vault Alpha</h4>
        <div class="token-code">309 481</div>
      </div>
      <button class="copy-btn" style="background:none;border:none;color:#8b949e;cursor:pointer;">📋</button>
    </div>

    <div class="token-card" data-code="851240">
      <div class="token-info">
        <h4>Matrix P2P Relay</h4>
        <div class="token-code">851 240</div>
      </div>
      <button class="copy-btn" style="background:none;border:none;color:#8b949e;cursor:pointer;">📋</button>
    </div>
  </div>

  <button class="btn-add" id="btn-add-account">+ Add New Account Key</button>
  <div id="toast" class="toast">Code copied to clipboard!</div>

  <script>
    // Live countdown timer ring
    let timeLeft = 30;
    const timerCircle = document.getElementById("global-timer");
    const totalCircumference = 2 * Math.PI * 15;
    timerCircle.style.strokeDasharray = totalCircumference;

    function tick() {
      const now = Math.floor(Date.now() / 1000);
      timeLeft = 30 - (now % 30);
      const offset = totalCircumference - (timeLeft / 30) * totalCircumference;
      timerCircle.style.strokeDashoffset = offset;

      if (timeLeft === 30) {
        refreshCodes();
      }
    }
    setInterval(tick, 1000);
    tick();

    function refreshCodes() {
      const cards = document.querySelectorAll(".token-card");
      cards.forEach(card => {
        const newCode = Math.floor(100000 + Math.random() * 900000).toString();
        card.dataset.code = newCode;
        card.querySelector(".token-code").textContent = newCode.slice(0, 3) + " " + newCode.slice(3);
      });
      if (window.InterOS && window.InterOS.ipc) {
        window.InterOS.ipc.send("org.interos.authenticator", 0x01, { refresh: true, timestamp: Date.now() });
      }
    }

    document.querySelectorAll(".token-card").forEach(card => {
      card.addEventListener("click", () => {
        const code = card.dataset.code;
        navigator.clipboard?.writeText(code);
        showToast("Copied " + code);
      });
    });

    document.getElementById("btn-add-account").addEventListener("click", () => {
      const name = prompt("Enter Account Label:", "Node Sentinel");
      if (!name) return;
      const newCode = Math.floor(100000 + Math.random() * 900000).toString();
      const card = document.createElement("div");
      card.className = "token-card";
      card.dataset.code = newCode;
      card.innerHTML = `
        <div class="token-info">
          <h4>${name}</h4>
          <div class="token-code">${newCode.slice(0,3)} ${newCode.slice(3)}</div>
        </div>
        <button class="copy-btn" style="background:none;border:none;color:#8b949e;cursor:pointer;">📋</button>
      `;
      card.addEventListener("click", () => {
        navigator.clipboard?.writeText(newCode);
        showToast("Copied " + newCode);
      });
      document.getElementById("tokens-list").appendChild(card);
      showToast("Account Key Provisioned");
      if (window.InterOS && window.InterOS.ipc) {
        window.InterOS.ipc.send("org.interos.authenticator", 0x02, { account: name });
      }
    });

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.opacity = "1";
      setTimeout(() => { t.style.opacity = "0"; }, 1800);
    }
  </script>
</body>
</html>
