<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Mesh Chat</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 14px;
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }
    .mesh-radar {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .radar-pulse {
      width: 14px;
      height: 14px;
      background: #06b6d4;
      border-radius: 50%;
      box-shadow: 0 0 10px #06b6d4;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 1; }
      50% { transform: scale(1.3); opacity: 0.5; }
      100% { transform: scale(0.9); opacity: 1; }
    }
    .chat-container {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-right: 4px;
      margin-bottom: 12px;
    }
    .bubble {
      max-width: 80%;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
    }
    .bubble.in {
      align-self: flex-start;
      background: #21262d;
      border: 1px solid #30363d;
      border-bottom-left-radius: 2px;
    }
    .bubble.out {
      align-self: flex-end;
      background: linear-gradient(135deg, #06b6d4, #2563eb);
      color: #ffffff;
      border-bottom-right-radius: 2px;
    }
    .bubble-meta { font-size: 9px; opacity: 0.7; margin-top: 4px; display: flex; justify-content: space-between; gap: 8px; }
    .input-row {
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      background: #161b22;
      border: 1px solid #30363d;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #06b6d4; }
    button {
      background: #06b6d4;
      border: none;
      color: #fff;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #0891b2; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display:flex; align-items:center; gap:8px;">
      <h3 style="margin:0; font-size:16px;">Mesh Chat</h3>
      <span style="font-size:10px; background:rgba(6,182,212,0.2); color:#06b6d4; padding:2px 6px; border-radius:8px;">P2P LoRa</span>
    </div>
    <span style="font-size:11px; color:#8b949e;">3 Nodes in Range</span>
  </div>

  <div class="mesh-radar">
    <div class="radar-pulse"></div>
    <div style="font-size:11px; color:#8b949e;">
      Connected to <strong>Sovereign Mesh #04</strong> (AES-256-GCM air-gapped)
    </div>
  </div>

  <div class="chat-container" id="chat-stream">
    <div class="bubble in">
      <div>Node-Alpha online. Routing packets on sub-gigahertz channel 868MHz.</div>
      <div class="bubble-meta"><span>Node-Alpha (RSSI -42dBm)</span><span>1 Hop</span></div>
    </div>
    <div class="bubble in">
      <div>Relay-3 confirmed telemetry packet received from Ring 0 kernel.</div>
      <div class="bubble-meta"><span>Relay-3 (RSSI -75dBm)</span><span>2 Hops</span></div>
    </div>
  </div>

  <div class="input-row">
    <input type="text" id="msg-input" placeholder="Broadcast encrypted mesh packet..." />
    <button id="btn-send">Send</button>
  </div>

  <script>
    const stream = document.getElementById("chat-stream");
    const input = document.getElementById("msg-input");
    const btnSend = document.getElementById("btn-send");

    function sendMsg() {
      const text = input.value.trim();
      if (!text) return;
      input.value = "";

      const outBubble = document.createElement("div");
      outBubble.className = "bubble out";
      outBubble.innerHTML = `
        <div>${text}</div>
        <div class="bubble-meta"><span>Broadcast</span><span>0 Hops</span></div>
      `;
      stream.appendChild(outBubble);
      stream.scrollTop = stream.scrollHeight;

      if (window.InterOS && window.InterOS.ipc) {
        window.InterOS.ipc.send("org.interos.meshchat", 0x20, { message: text, timestamp: Date.now() });
      }

      // Simulated peer response
      setTimeout(() => {
        const inBubble = document.createElement("div");
        inBubble.className = "bubble in";
        inBubble.innerHTML = `
          <div>Packet verified & relayed by Node-Gamma. Hop count: 1.</div>
          <div class="bubble-meta"><span>Node-Gamma (RSSI -58dBm)</span><span>1 Hop</span></div>
        `;
        stream.appendChild(inBubble);
        stream.scrollTop = stream.scrollHeight;
      }, 1200);
    }

    btnSend.addEventListener("click", sendMsg);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMsg();
    });
  </script>
</body>
</html>
