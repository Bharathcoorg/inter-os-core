name: InterOS Core CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  workspace-check:
    name: Workspace Check & SDK Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-src

      - name: Cargo Check Workspace
        run: cargo check --workspace

      - name: Run SDK Tests
        run: cargo test -p interos-std

  microkernel-targets:
    name: Multi-Architecture Microkernel Build Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-15
          components: rust-src

      - name: Install Bare-Metal Targets for Active Nightly Toolchain
        run: |
          rustup target add x86_64-unknown-none --toolchain nightly-2026-09-15
          rustup target add aarch64-unknown-none --toolchain nightly-2026-09-15
          rustup target add riscv64gc-unknown-none-elf --toolchain nightly-2026-09-15

      - name: Build x86_64 userspace binaries required by kernel image embedding
        run: |
          cargo build --manifest-path userspace/init/Cargo.toml --target x86_64-unknown-none
          for app in settings terminal compositor launcher dialer vault camera calculator browser messages calendar music; do
            cargo build --manifest-path "apps/$app/Cargo.toml" --target x86_64-unknown-none
          done

      - name: Check x86_64 Microkernel Target
        run: cargo check --manifest-path kernel/Cargo.toml --target x86_64-unknown-none

      - name: Check AArch64 Microkernel Target
        run: cargo check --manifest-path kernel-aarch64/Cargo.toml --target aarch64-unknown-none

      - name: Check RISC-V 64 Microkernel Target
        run: cargo check --manifest-path kernel-riscv64/Cargo.toml --target riscv64gc-unknown-none-elf

  studio-validation:
    name: Developer Studio Runtime Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2026-09-15
          components: rust-src

      - name: Install Bare-Metal Targets for Active Nightly Toolchain
        run: |
          rustup target add x86_64-unknown-none --toolchain nightly-2026-09-15
          rustup target add aarch64-unknown-none --toolchain nightly-2026-09-15
          rustup target add riscv64gc-unknown-none-elf --toolchain nightly-2026-09-15

      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-system-arm qemu-system-misc

      - name: Verify JavaScript Engine Syntax
        run: node --check emulator/app.js

      - name: Verify Python Scripts Syntax
        run: python -m py_compile emulator/server.py tools/interos.py tests/test_adversarial_security.py

      - name: Install Python Dependencies & Verify CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install cryptography
          python tools/interos.py doctor
          python tools/interos.py devices

      - name: Run Adversarial Security Tests
        run: |
          python emulator/server.py &
          sleep 3
          python tests/test_adversarial_security.py

      - name: Run RAPP v2 Trust-Boundary Tests
        run: python tests/test_rapp_v2.py

      - name: Run Service Lifecycle Contract Tests
        run: python tests/test_service_lifecycle_contract.py


  qemu-vertical-slice:
    name: QEMU x86_64 Build Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup Rust Nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-09-15
          components: rust-src, llvm-tools-preview
      - name: Install x86_64 Bare-Metal Target
        run: rustup target add x86_64-unknown-none --toolchain nightly-2026-09-15
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86
      - name: Build embedded x86_64 userspace binaries
        run: |
          cargo build --manifest-path userspace/init/Cargo.toml --target x86_64-unknown-none
          for app in settings terminal compositor launcher dialer vault camera calculator browser messages calendar music; do
            cargo build --manifest-path "apps/$app/Cargo.toml" --target x86_64-unknown-none
          done
      - name: Verify kernel QEMU target
        run: cargo check --manifest-path kernel/Cargo.toml --target x86_64-unknown-none
      - name: Configure portable bare-metal crypto backend
        run: echo 'RUSTFLAGS=--cfg curve25519_dalek_backend="serial"' >> "$GITHUB_ENV"

      - name: Build kernel QEMU image input
        run: cargo build --manifest-path kernel/Cargo.toml --target x86_64-unknown-none
      - name: Build bootable BIOS image
        run: cargo run --manifest-path boot/Cargo.toml -- target/x86_64-unknown-none/debug/kernel target/interos-os-ci.img
      - name: Boot image and verify PID1 lifecycle handoff
        run: |
          set -o pipefail
          timeout 20s qemu-system-x86_64 \\
            -drive format=raw,file=target/interos-os-ci.img \\
            -serial file:target/interos-qemu-serial.log \\
            -display none -no-reboot -no-shutdown || test $? -eq 124
          test -s target/interos-qemu-serial.log
          grep -F "INTER OS CORE -- Open-Source Rust Mobile Microkernel" target/interos-qemu-serial.log
          grep -F "[OK] PID1 userspace service manager spawned" target/interos-qemu-serial.log
          grep -F "[PID1] Service started through lifecycle ABI." target/interos-qemu-serial.log
          grep -F "[PID1] Service registry observed; userspace lifecycle loop active." target/interos-qemu-serial.log
          grep -F "[PID1] Service stop lifecycle contract exercised." target/interos-qemu-serial.log
          grep -F "[PID1] Service restart lifecycle contract exercised." target/interos-qemu-serial.log
          grep -F "[PID1] All system services running after bootstrap." target/interos-qemu-serial.log
      - name: Verify boot image builder
        run: cargo check --manifest-path boot/Cargo.toml
