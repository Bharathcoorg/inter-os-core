[package]
license = "AGPL-3.0-only"
name = "kernel"
version = "0.1.0"
edition = "2021"
authors = ["Inter OS Contributors"]
description = "Core trusted microkernel for Inter OS (x86_64)"

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
# WHY: this binary is `#![no_main]` bare-metal boot code that owns the kernel
# `#[panic_handler]`. Building a test harness for it produced a duplicate
# `panic_impl` lang item and failed the whole `cargo test` run. It contains no
# tests, so the harness is pure loss. All unit tests live in the `[lib]` above.
test = false
doctest = false

[features]
default = []
# WHY this feature exists and why it is OFF by default: the COM1 console is an
# unauthenticated control plane -- `service_serial_commands` dispatches every
# complete UART line with no CapHandle and no caller identity. A handful of
# verbs mutate authentication / lock / kill-switch state (FINGERPRINT_INJECT,
# KILLSWITCH_TOGGLE), inject synthetic battery telemetry (BATTERY_SET), or read
# and write arbitrary guest paths (READ_FILE, WRITE_FILE). The same channel also
# carries device-wide trust and fault mutations: RAPP_TRUST mints a publisher
# trust root (so an attacker's signed .rapp is accepted), TLS_TRUST_BEGIN /
# CHUNK / COMMIT / REVOKE and the single-line TLS_TRUST install or withdraw TLS
# trust anchors (so an attacker can MITM every TLS connection), PANIC_POLICY SET
# changes the panic response, and TRIGGER_KERNEL_PANIC forces a kernel panic
# (remote DoS). Shipping those in a production image lets anyone with the serial
# socket unlock the owner account, cut the radios, read /user/.accounts, trust
# their own CA / publisher, or crash the device. They are therefore compiled OUT
# of every default build and exist only when a developer explicitly opts in with
# `--features debug-control-plane` (or `INTEROS_DEBUG_CONTROL_PLANE=1` via
# tools/interos.py). There is deliberately no runtime switch: with the feature
# off the verb handlers are not in the binary at all, so no console line can
# re-enable them. Input injection (INPUT_TOUCH/INPUT_KEY/...), diagnostics
# (DIAG_STATE/PROC_LIST/SET_MODE/...), the read-only trust/policy observers
# (TLS_TRUST_LIST, PANIC_POLICY GET) and the path-confined Studio filesystem
# channel (STUDIO_FS_*) stay available in production. SENSOR_INJECT also stays
# (Device Studio orientation testing needs it) but labels its reply synthetic;
# sys_sensor_read independently reports NOT_IMPLEMENTED because no physical IMU
# is present, so injected values never reach an app as a measurement.
debug-control-plane = []

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.9.8"
uart_16550 = "0.8.1"
volatile = "0.4.6"
pic8259 = "0.11.0"
linked_list_allocator = "0.10.6"
pc-keyboard = "0.7.0"
conquer-once = { version = "0.4.0", default-features = false }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
# Bare-metal x86_64 builds use the scalar SHA-256 path to avoid LLVM vector
# legalization ICEs seen with the hosted SIMD backend.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
interos-android-shared = { path = "src/compat/android/shared" }

[build-dependencies]
sha2 = "0.10.9"

[profile.dev]
opt-level = 1
panic = "abort"

[profile.test]
opt-level = 1

[profile.release]
panic = "abort"
lto = true
# WHY strip, and what it actually buys -- measured, not assumed. The release
# kernel ELF is 18.2MB unstripped and 3.6MB with debug sections removed, because
# `libkernel.rlib` is 20MB of them. That is a real saving on the build artifact:
# 14.5MB per build, on disk, for every incremental.
#
# WHY it must not be claimed as a size win for the guest: measured, the boot
# image is 5601 KB either way. `boot/Cargo.toml` packages only the kernel's
# LOAD segments into the BIOS image, so everything stripped here never reached
# the image in the first place. Anyone reading this as "smaller device" should
# read the measurement again.
#
# WHY `debuginfo` and not `symbols`: `symbols` removes a further 126KB from an
# already-large artifact and would make the addresses the panic handler prints
# undecodable, because that handler logs raw addresses rather than names. A full
# strip trades a trace of size for an undebuggable guest crash.
strip = "debuginfo"
