[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
authors = ["Inter OS Contributors"]
description = "Core trusted microkernel for Inter OS (x86_64)"

[lib]
name = "kernel"
path = "src/lib.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
# WHY: this binary is `#![no_main]` bare-metal boot code that owns the kernel
# `#[panic_handler]`. Building a test harness for it produced a duplicate
# `panic_impl` lang item and failed the whole `cargo test` run. It contains no
# tests, so the harness is pure loss. All unit tests live in the `[lib]` above.
test = false
doctest = false

[dependencies]
bootloader_api = "0.11.17"
x86_64 = "0.15.5"
spin = "0.9.8"
uart_16550 = "0.8.1"
volatile = "0.4.6"
pic8259 = "0.11.0"
linked_list_allocator = "0.10.6"
pc-keyboard = "0.7.0"
conquer-once = { version = "0.4.0", default-features = false }
ed25519-dalek = { version = "2.1.1", default-features = false, features = ["alloc"] }
# Bare-metal x86_64 builds use the scalar SHA-256 path to avoid LLVM vector
# legalization ICEs seen with the hosted SIMD backend.
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
interos-android-shared = { path = "src/compat/android/shared" }

[profile.dev]
opt-level = 1
panic = "abort"
debug = false

[profile.test]
opt-level = 1

[profile.release]
panic = "abort"
# WHY strip, and what it actually buys -- measured, not assumed. The release
# kernel ELF is 18.2MB unstripped and 3.6MB with debug sections removed, because
# `libkernel.rlib` is 20MB of them. That is a real saving on the build artifact:
# 14.5MB per build, on disk, for every incremental.
#
# WHY it must not be claimed as a size win for the guest: measured, the boot
# image is 5601 KB either way. `boot/Cargo.toml` packages only the kernel's
# LOAD segments into the BIOS image, so everything stripped here never reached
# the image in the first place. Anyone reading this as "smaller device" should
# read the measurement again.
#
# WHY `debuginfo` and not `symbols`: `symbols` removes a further 126KB from an
# already-large artifact and would make the addresses the panic handler prints
# undecodable, because that handler logs raw addresses rather than names. A full
# strip trades a trace of size for an undebuggable guest crash.
strip = "debuginfo"
