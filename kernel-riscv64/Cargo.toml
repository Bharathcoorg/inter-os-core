[package]
license = "AGPL-3.0-only"
name = "kernel-riscv64"
version = "0.1.0"
edition = "2021"
authors = ["Inter OS Contributors"]
description = "RISC-V 64 Sovereign Smartphone Physical Microkernel Payload for Inter OS"

[dependencies]
spin = "0.9.8"
linked_list_allocator = "0.10.6"

# Declare panic = "abort" for bare-metal `#![no_std]` targets excluded from the workspace.
[profile.dev]
opt-level = 2
panic = "abort"

[profile.release]
panic = "abort"

